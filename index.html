<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
     <div class="hero_image">
        <img class="img_witdh" src="./images/image.png" alt="">
     </div>
     <div class="header">
       <div style="display: flex; align-items: center; gap: 110px;">
        <img src="./images/Physionic.png" alt="">
        <div class="paragraef_header">
            <p>Home</p>
            <p>Product</p>
            <p>Pricing</p>
            <p>Contact</p>
        </div>
       </div>
       <div>
        <button class="btn_header">Get Quote Now →</button>
       </div>
     </div>
     <div class="section1">
       <div class="the_boss">
     <h1 class="section1_text">Meet the Best Hospital</h1>
     <p>We know how large objects will act, 
but things on a small scale.</p>
<div class="section1_btn">
    <button style="width: 145px; padding: 11px; background-color: #23A6F0; border: none; border-radius: 50px; color: white;">Get Quote Now</button>
    <button style="background: none; width: 122px; border: 1px solid rgb(223, 223, 223); padding: 11px; border-radius: 50px; color: white;">Learn More</button>
</div>
       <div class="appointment-box">

    <h2>Book Appointment</h2>

    <div class="form-group">
        <label>Name *</label>
        <input type="text" class="form-control" placeholder="Full Name *">
    </div>

    <div class="form-group">
        <label>Email address *</label>
        <input type="email" class="form-control" placeholder="example@gmail.com">
    </div>

    <div class="form-group">
        <label>Department *</label>
        <div class="select-wrapper">
            <select class="form-control">
                <option>Please Select</option>
                <option>Cardiology</option>
                <option>Neurology</option>
                <option>Dental</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label>Time *</label>
        <div class="select-wrapper">
            <select class="form-control">
                <option>4:00 Available</option>
                <option>5:00 Available</option>
                <option>6:00 Available</option>
            </select>
        </div>
    </div>

    <button class="submit-btn">
        Book Appointment
    </button>

</div>
       </div>
     </div>
</body>
</html>
